report_usage:
  name: Report usage
  description: Report an integer-minute usage delta from an agent.
  fields:
    kid: {required: true, selector: {text: {}}}
    device: {required: true, selector: {text: {}}}
    category: {required: true, selector: {text: {}}}
    minutes: {required: true, selector: {number: {min: 1, max: 30, mode: box}}}
report_unknown:
  name: Report unknown (legacy)
  description: Compatibility no-op for older agents; raw activity stays on the device.
  fields:
    kid: {required: true, selector: {text: {}}}
    device: {required: true, selector: {text: {}}}
    kind: {required: true, selector: {select: {options: [process, domain]}}}
    id: {required: true, selector: {text: {}}}
    hint: {required: false, selector: {text: {}}}
get_rules:
  name: Get rules
  description: Return the versioned classification map to an agent.
get_status:
  name: Get status
  description: Return category, child-wide, and device-wide aggregate usage and limits.
  fields:
    kid: {required: true, selector: {text: {}}}
    device: {required: true, selector: {text: {}}}
get_classifications:
  name: Get classifications (legacy)
  description: Compatibility response for older agents. Activity catalogs are device-local.
  fields:
    kid: {required: true, selector: {text: {}}}
set_classification:
  name: Set classification
  description: Assign an app or website to a kid-specific category and synchronize the rule to agents.
  fields:
    kid: {required: true, selector: {text: {}}}
    kind: {required: true, selector: {select: {options: [process, domain]}}}
    id: {required: true, selector: {text: {}}}
    category: {required: true, selector: {text: {}}}
heartbeat:
  name: Heartbeat
  description: Mark an agent as connected.
  fields:
    kid: {required: true, selector: {text: {}}}
    device: {required: true, selector: {text: {}}}
    agent_version: {required: false, selector: {text: {}}}
reset:
  name: Reset usage
  description: Reset one category or all usage for a kid.
  fields:
    kid: {required: true, selector: {text: {}}}
    category: {required: false, selector: {text: {}}}
